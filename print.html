<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이게 글씨냐! 연습지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; color: #1d1d1f; background: #f5f5f7; }

    /* 화면용 상단 안내바 (인쇄 시 숨김) */
    .bar {
      background: #f5f5f7; border-bottom: 1px solid #d2d2d7;
    }
    .bar-inner {
      max-width: 768px; margin: 0 auto; padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .bar p { font-size: 14px; color: #6e6e73; }
    .print-btn {
      background: #0071e3; color: #fff; border: none; cursor: pointer;
      font-family: inherit; font-weight: 600; font-size: 14px;
      border-radius: 999px; padding: 10px 20px; flex-shrink: 0;
    }
    .print-btn:hover { background: #0077ed; }

    /* 인쇄 영역 */
    .sheet {
      max-width: 680px; margin: 0 auto; padding: 40px 32px;
      display: flex; flex-direction: column; background: #fff;
    }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .sheet-head .label { font-size: 12px; color: #6e6e73; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
    .sheet-head .date { font-size: 12px; color: #6e6e73; }
    .rule { height: 1px; background: #d2d2d7; margin-bottom: 24px; }

    .section-label { font-size: 12px; font-weight: 600; color: #6e6e73; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 12px; }
    .target {
      border: 2px solid #1d1d1f; border-radius: 16px; padding: 24px; margin-bottom: 24px;
    }
    .target p { font-weight: 700; letter-spacing: .1em; }
    .target.single p { font-size: 28px; text-align: center; }
    .target.para p { font-size: 20px; line-height: 1.8; }

    .write-area { flex: 1; display: flex; flex-direction: column; }
    .write-lines { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .write-lines .line { border-bottom: 2px dashed #d2d2d7; }
    .foot { text-align: center; font-size: 12px; color: #9ca3af; padding-top: 16px; }

    @media print {
      @page { size: A4; margin: 15mm; }
      body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .bar { display: none; }
      .sheet {
        max-width: none; padding: 0;
        height: calc(297mm - 30mm); overflow: hidden;
      }
      .target { border-color: #1d1d1f; }
      .write-lines .line { border-color: #9ca3af; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="bar-inner">
      <p>인쇄 후 빈 칸에 손으로 따라 쓰고, 사진을 찍어 앱에서 채점받으세요.</p>
      <button class="print-btn" onclick="window.print()">🖨️ 인쇄하기</button>
    </div>
  </div>

  <div class="sheet">
    <div class="sheet-head">
      <span class="label" id="head-label">이게 글씨냐! 연습지</span>
      <span class="date" id="head-date"></span>
    </div>
    <div class="rule"></div>

    <p class="section-label" id="target-label">따라 쓸 문장</p>
    <div class="target" id="target"></div>

    <p class="section-label">따라 써보세요</p>
    <div class="write-area">
      <div class="write-lines" id="write-lines"></div>
    </div>

    <p class="foot">이 종이를 사진으로 찍어 앱에 올리면 AI가 채점해 드립니다.</p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const sentence = params.get('sentence') || '';
    const lines = sentence.split('\n').filter(Boolean);
    const isPara = lines.length > 1;

    // 제목/날짜
    document.getElementById('head-label').textContent =
      '이게 글씨냐! 연습지 · ' + (isPara ? '문단 쓰기' : '문장 쓰기');
    document.getElementById('head-date').textContent = new Date().toLocaleDateString('ko-KR');
    document.getElementById('target-label').textContent = '따라 쓸 ' + (isPara ? '문단' : '문장');

    // 제시 문장
    const target = document.getElementById('target');
    target.classList.add(isPara ? 'para' : 'single');
    target.innerHTML = (isPara ? lines : [sentence])
      .map((l) => '<p>' + escapeHtml(l) + '</p>').join('');

    // 필기선: 문단 = 줄 수 × 2 + 1 (최대 11), 문장 = 9줄
    const count = isPara ? Math.min(lines.length * 2 + 1, 11) : 9;
    const wrap = document.getElementById('write-lines');
    for (let i = 0; i < count; i++) {
      const div = document.createElement('div');
      div.className = 'line';
      wrap.appendChild(div);
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
  </script>
</body>
</html>
